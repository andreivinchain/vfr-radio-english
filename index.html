<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>VFR Radio English — Польша</title>
<style>
:root{
  --bg:#0b1220;--card:#121b2e;--card2:#182440;--line:#243352;
  --text:#e8eefc;--muted:#8da0c4;--accent:#4fb3ff;--accent2:#ffb84f;
  --ok:#3ddc84;--bad:#ff6b6b;--atc:#1d2a4a;--pilot:#1a3a2e;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px}
main{padding:14px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.module{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.module .num{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.module .t{flex:1;min-width:0}
.module .t b{display:block;font-size:16px}
.module .t span{color:var(--muted);font-size:13.5px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);margin:2px 4px 2px 0}
.ctx{background:linear-gradient(180deg,var(--card2),var(--card));border-left:3px solid var(--accent2)}
.ctx h3{margin:0 0 6px;font-size:14px;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em}
.bubble{border-radius:var(--r);padding:12px 14px;margin:10px 0;position:relative}
.bubble.atc{background:var(--atc);border:1px solid #2b3d6b}
.bubble.pilot{background:var(--pilot);border:1px solid #2a5a45}
.bubble .who{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.bubble .txt{font-size:17px;line-height:1.5;font-weight:500}
.bubble .txt.hidden{filter:blur(7px);user-select:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:#06101f;border-color:transparent}
.btn.ok{background:var(--ok);color:#06101f;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.btn.big{width:100%;justify-content:center;padding:14px}
textarea{width:100%;min-height:84px;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:vertical}
.keys{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.key{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.key .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;font-size:14px}
.key.hit .box{background:var(--ok);border-color:var(--ok);color:#06101f}
.key.miss .box{background:var(--bad);border-color:var(--bad);color:#fff}
.key .k{flex:1}
.key .ex{color:var(--muted);font-size:13px}
.score{font-size:28px;font-weight:800}
.note{border-left:3px solid var(--accent);padding-left:12px;margin:10px 0;color:#c9d6f0;font-size:15px}
.note b{color:var(--text)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.steps{display:flex;gap:4px;margin:4px 0 12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--ok)}
.steps i.cur{background:var(--accent)}
.foot{display:flex;gap:8px;margin-top:14px}
.foot .btn{flex:1;justify-content:center}
.warn{background:#2a2410;border:1px solid #5a4a14;color:#ffe08a;border-radius:12px;padding:10px 12px;font-size:14px}
.ref h4{margin:14px 0 6px;color:var(--accent)}
.ref .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.ref .grid div{background:var(--card2);border-radius:8px;padding:6px 8px;font-size:14px}
.ref .grid div b{color:var(--accent2)}
.ref ul{padding-left:18px;margin:6px 0}
.ref li{margin:4px 0}
.set label{display:block;margin:12px 0 4px;color:var(--muted);font-size:14px}
.set input[type=text],.set select{width:100%;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.set input[type=range]{width:100%}
.pulse{animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.hl{background:rgba(79,179,255,.18);border-radius:4px;padding:0 3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#223;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="iconbtn" id="back" aria-label="Назад">‹</button>
  <h1 id="title">VFR Radio English</h1>
  <button class="iconbtn" id="refbtn" title="Шпаргалка">📖</button>
  <button class="iconbtn" id="setbtn" title="Настройки">⚙︎</button>
</header>
<main id="main"></main>
</div>

<script>
/* ===================== ДАННЫЕ ===================== */
const PH = {A:'Alfa',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliett',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};
const DIG = ['zero','one','two','three','four','five','six','seven','eight','niner'];

const MODULES = [
{
 id:'basics', title:'Основы эфира', sub:'Позывной, цифры, стандартные слова, radio check',
 intro:'Короткие упражнения на механику: как звучит позывной, как читаются числа и частоты, какие слова имеют строго определённое значение. Без этого остальное не работает.',
 steps:[
  {ctx:'Стоянка GA на EPGD. Перед первым вызовом хочешь убедиться, что радио и частота в порядке. Частота Gdańsk Ground — 131.330.',
   who:'pilot', pilot:'Gdańsk Ground, {CS}, radio check 131.330.',
   atc2:'{CS}, Gdańsk Ground, readability 5.',
   keys:[['Позывной станции первым','gdansk ground|gdańsk ground'],['Свой позывной','CS'],['Слова radio check','radio check'],['Частота по цифрам','131.330']],
   note:'<b>Порядок:</b> кого вызываешь → кто ты → что хочешь. Шкала читаемости 1–5 (SERA.14055 / Doc 9432). «Loud and clear» в эфире встречается, но стандарт — число.',
   tips:['Частоту читать по одной цифре: one three one decimal three three zero.','Не говорить «how do you read» — достаточно «radio check».']},
  {ctx:'Диспетчер даёт короткое указание. Нужен правильный ответ одним словом.',
   who:'atc', atc:'{CS}, report GOLF.',
   pilot:'Wilco, {CS}.',
   keys:[['WILCO (не ROGER)','wilco'],['Позывной','CS']],
   note:'<b>WILCO</b> = понял и выполню. <b>ROGER</b> = только «принял» — для указаний, требующих действия, он не подходит. <b>AFFIRM</b>/<b>NEGATIVE</b> — ответы на вопрос. Указание «report …» не требует полного readback.',
   tips:['«Roger, wilco» — лишнее. Достаточно wilco.','Не отвечать «OK» или «copied».']},
  {ctx:'Диспетчер передал несколько элементов быстро, одного ты не разобрал (squawk). Попроси повторить только его.',
   who:'atc', atc:'{CS}, squawk 2341, QNH 1018, runway 29.',
   pilot:'Say again squawk, {CS}.',
   atc2:'{CS}, squawk 2341.',
   keys:[['SAY AGAIN','say again'],['Уточнение, что именно','squawk'],['Позывной','CS']],
   note:'«Say again» + элемент: <i>say again squawk / say again QNH / say again all after runway</i>. «Please repeat» — не стандарт. Переспросить всегда дешевле, чем повторить неверно.',
   tips:['Не додумывать — если не уверен, переспроси.']},
  {ctx:'Тренировка чисел: QNH и частота.',
   who:'atc', atc:'{CS}, QNH 1004, contact Gdańsk Approach 127.280.',
   pilot:'QNH 1004, Gdańsk Approach 127.280, {CS}.',
   keys:[['QNH 1004','1004'],['Частота 127.280','127.280'],['Позывной в конце','CS']],
   note:'QNH и назначенная частота — обязательный readback (SERA.14035). Числа читаются по цифрам: one zero zero four; one two seven decimal two eight zero. «Niner» вместо nine, «tousand» для тысяч.',
   tips:['Не говорить «one thousand four» для QNH.','Название станции при смене частоты повторить — это защита от ошибки.']},
  {ctx:'Указание по высоте.',
   who:'atc', atc:'{CS}, descend to altitude 1500 feet, QNH 1018.',
   pilot:'Descending to altitude 1500 feet, QNH 1018, {CS}.',
   keys:[['Высота 1500 feet','1500'],['QNH 1018','1018'],['Позывной','CS']],
   note:'Высоты читаются «one tousand five hundred», не по цифрам. Указания по уровню — обязательный readback. Отвечать в форме действия: <i>descending / climbing / maintaining</i>.',
   tips:['«Descend» в ответе — ошибка: нужно «descending».']},
  {ctx:'Диспетчер просит подтвердить.',
   who:'atc', atc:'{CS}, confirm squawk 2341.',
   pilot:'Affirm, squawk 2341, {CS}.',
   keys:[['AFFIRM','affirm'],['Код 2341','2341'],['Позывной','CS']],
   note:'<b>Affirm</b> (не «affirmative», не «yes»). На «confirm …» отвечаем affirm/negative плюс значение.',
   tips:[]}
 ]
},
{
 id:'base', title:'Базовый полёт: EPGD → EPEL', sub:'Стоянка → руление → вылет → маршрут → FIS → прибытие на неконтролируемый аэродром',
 intro:'Полёт на Cessna 172 из Гданьска (контролируемый аэродром, CTR класса D) в Эльблонг (неконтролируемый, Elbląg Radio). Выход из CTR через точку GOLF (мол в устье Вислы Śmiałej), далее с FIS Gdańsk Information. Частоты и точки — из AIP Польши, но перед реальным полётом сверяй по действующему AIP/NOTAM.',
 steps:[
  {ctx:'Стоянка GA. Прослушай ATIS (129.630) и выпиши: буква информации, ВПП в работе, QNH. Потом «отчитайся» самому себе — это тренировка извлечения главного.',
   who:'atc', atc:'Gdańsk information Charlie, time 0820. Runway in use 29. Wind 280 degrees 8 knots. Visibility 10 kilometres or more. Clouds few 3500 feet. Temperature 12, dew point 7. QNH 1018. VFR departures contact Gdańsk Delivery 131.325. On initial contact advise you have information Charlie.',
   pilot:'Information Charlie, runway 29, QNH 1018.',
   keys:[['Буква информации','charlie'],['ВПП 29','29'],['QNH 1018','1018']],
   note:'ATIS слушаем до первого вызова. Из него нужны: буква, ВПП, QNH, ветер, кого вызывать первым. При первом контакте говорим «information Charlie» и QNH — это сигнал диспетчеру, что брифинг у тебя есть.',
   tips:['Если на одной радиостанции — слушай ATIS до запуска или с handheld.']},
  {ctx:'Первый вызов Gdańsk Delivery 131.325. Ты на стоянке GA, информация Charlie, QNH 1018, VFR в Эльблонг.',
   who:'pilot', pilot:'Gdańsk Delivery, {CS}, Cessna 172, general aviation apron, information Charlie, QNH 1018, VFR to Elbląg, request departure clearance.',
   atc2:'{CS}, Gdańsk Delivery, cleared to leave CTR via GOLF, not above 1500 feet, squawk 2341, runway 29.',
   keys:[['Станция, затем позывной','gdansk delivery|gdańsk delivery'],['Позывной','CS'],['Тип ВС','cessna 172|cessna'],['Где стоишь','apron|general aviation'],['Информация Charlie + QNH','charlie'],['QNH 1018','1018'],['Куда и что просишь','elbląg|elblag'],['Request …','request']],
   note:'Структура первого вызова: <b>кто ты → где ты → что знаешь (ATIS, QNH) → что хочешь</b>. На EPGD VFR-вылеты получают разрешение на выход из CTR заранее — через Delivery.',
   tips:['Не начинать с «hello/good morning … with you» — лишние слова.','Тип ВС важен: диспетчер планирует по нему.']},
  {ctx:'Delivery выдал разрешение на выход из CTR. Повтори обязательные элементы.',
   who:'atc', atc:'{CS}, Gdańsk Delivery, cleared to leave CTR via GOLF, not above 1500 feet, squawk 2341, runway 29.',
   pilot:'Cleared to leave CTR via GOLF, not above 1500 feet, squawk 2341, runway 29, {CS}.',
   atc2:'{CS}, readback correct, contact Gdańsk Ground 131.330 for taxi.',
   keys:[['Маршрут: via GOLF','golf'],['Ограничение: not above 1500 feet','1500'],['Squawk 2341','2341'],['ВПП 29','29'],['Позывной в конце','CS']],
   note:'<b>SERA.14035:</b> обязательно повторяются маршрутное разрешение, ограничения по высоте, код SSR, ВПП, QNH, частота. Порядок — как у диспетчера. Позывной — в конце readback.',
   tips:['«Not above 1500» ≠ «at 1500». Повторяй именно формулировку.']},
  {ctx:'Переходи на Gdańsk Ground 131.330 и запроси руление.',
   who:'pilot', pilot:'Gdańsk Ground, {CS}, general aviation apron, request taxi.',
   atc2:'{CS}, Gdańsk Ground, taxi to holding point Alfa 4 runway 29 via Bravo and Alfa, QNH 1018.',
   keys:[['Станция','gdansk ground|gdańsk ground'],['Позывной','CS'],['Где ты','apron'],['Request taxi','request taxi|taxi']],
   note:'Ground уже знает твоё разрешение от Delivery — повторять его не надо. Короткий вызов: где стоишь и что хочешь.',
   tips:['Если нужен запуск с разрешения — «request start-up and taxi».']},
  {ctx:'Readback указания на руление.',
   who:'atc', atc:'{CS}, Gdańsk Ground, taxi to holding point Alfa 4 runway 29 via Bravo and Alfa, QNH 1018.',
   pilot:'Taxi to holding point Alfa 4 runway 29 via Bravo and Alfa, QNH 1018, {CS}.',
   atc2:'{CS}, correct. When ready, contact Gdańsk Tower 118.105.',
   keys:[['Предел руления: holding point Alfa 4','alfa 4|alpha 4|a4'],['ВПП 29','29'],['Маршрут: via Bravo and Alfa','bravo'],['QNH 1018','1018'],['Позывной','CS']],
   note:'Руление по любой ВПП и указания «taxi/hold short/cross» — обязательный readback. Предел руления (holding point) — главное: дальше без отдельного разрешения нельзя. Записывай маршрут руления до того, как повторишь.',
   tips:['Готовься, что названия РД на незнакомом аэродроме не запомнятся — пиши.']},
  {ctx:'Ты у предварительного Alfa 4. Переходи на Tower 118.105 и доложи готовность.',
   who:'pilot', pilot:'Gdańsk Tower, {CS}, holding point Alfa 4, ready for departure.',
   atc2:'{CS}, Gdańsk Tower, behind landing Boeing 737, line up runway 29 and wait, behind.',
   keys:[['Станция','gdansk tower|gdańsk tower'],['Позывной','CS'],['Место: holding point Alfa 4','alfa 4|alpha 4|a4'],['Ready for departure (не take-off)','ready for departure|ready']],
   note:'Слово <b>take-off</b> пилот и диспетчер используют только в самом разрешении на взлёт и его отмене. До этого — <i>departure</i>. Это защита от повторения Тенерифе.',
   tips:['«Ready for take-off» — классическая ошибка.']},
  {ctx:'Условное разрешение занять ВПП за садящимся Boeing 737.',
   who:'atc', atc:'{CS}, behind landing Boeing 737, line up runway 29 and wait, behind.',
   pilot:'Behind landing Boeing 737, lining up runway 29 and wait, behind, {CS}.',
   atc2:'{CS}, wind 280 degrees 8 knots, runway 29, cleared for take-off.',
   keys:[['Условие: behind landing Boeing 737','behind'],['Тип ВС в условии','737|boeing'],['Line up / lining up','line up|lining up'],['ВПП 29','29'],['Повтор «behind» в конце','behind[^]*behind'],['Позывной','CS']],
   note:'Условное разрешение (ICAO Doc 4444 §12.2.7, SERA.8015): <b>условие → указание → повтор условия</b>. Повторяется целиком, с условием. Занимать ВПП можно только после того, как ты увидел этот 737 и он прошёл.',
   tips:['Если 737 не видишь — «negative contact» и не выезжать.']},
  {ctx:'Разрешение на взлёт.',
   who:'atc', atc:'{CS}, wind 280 degrees 8 knots, runway 29, cleared for take-off.',
   pilot:'Runway 29, cleared for take-off, {CS}.',
   keys:[['ВПП 29','29'],['Cleared for take-off','cleared for take-off|cleared for takeoff|take-off|takeoff'],['Позывной','CS']],
   note:'Ветер не повторяется. ВПП и «cleared for take-off» — обязательно. Это единственное место, где звучит «take-off».',
   tips:['Не добавлять «rolling» — это не стандарт SERA.']},
  {ctx:'После отрыва Tower даёт указание.',
   who:'atc', atc:'{CS}, after departure turn left heading 120, not above 1500 feet, report GOLF.',
   pilot:'Left heading 120, not above 1500 feet, wilco, {CS}.',
   keys:[['Курс: left heading 120','120'],['Not above 1500 feet','1500'],['Wilco на report GOLF','wilco|report golf'],['Позывной','CS']],
   note:'Курс и уровень — обязательный readback. Указание доложить точку — достаточно «wilco».',
   tips:[]},
  {ctx:'Ты над GOLF на 1500 ft. Доложи выход из CTR.',
   who:'pilot', pilot:'Gdańsk Tower, {CS}, GOLF, 1500 feet, leaving CTR.',
   atc2:'{CS}, roger, leaving CTR approved, squawk 7000, contact Gdańsk Information 127.150.',
   keys:[['Станция','gdansk tower|gdańsk tower'],['Позывной','CS'],['Точка GOLF','golf'],['Высота 1500','1500'],['Leaving CTR','leaving']],
   note:'Доклад позиции: <b>позывной → точка → высота → намерение</b>. После выхода из CTR диспетчер передаёт тебя FIS.',
   tips:[]},
  {ctx:'Readback: код и частота FIS.',
   who:'atc', atc:'{CS}, roger, leaving CTR approved, squawk 7000, contact Gdańsk Information 127.150.',
   pilot:'Squawk 7000, Gdańsk Information 127.150, {CS}.',
   keys:[['Squawk 7000','7000'],['Станция Gdańsk Information','information'],['Частота 127.150','127.150'],['Позывной','CS']],
   note:'7000 — код VFR conspicuity в Европе. Назначенная частота повторяется с названием станции.',
   tips:['«Goodbye» в конце необязателен, но допустим.']},
  {ctx:'Первый вызов FIS. Gdańsk Information 127.150 (сектор «восток»). Ты над GOLF, 1500 ft, QNH 1018, следуешь в Эльблонг.',
   who:'pilot', pilot:'Gdańsk Information, {CS}, Cessna 172, from Gdańsk to Elbląg, over GOLF, 1500 feet, QNH 1018, request flight information service.',
   atc2:'{CS}, Gdańsk Information, roger, QNH 1018, no reported traffic, report before changing frequency.',
   keys:[['Станция','information'],['Позывной','CS'],['Тип','cessna'],['Откуда/куда','elbląg|elblag'],['Позиция GOLF','golf'],['Высота 1500','1500'],['QNH','1018']],
   note:'FIS — <b>не контроль</b>: информатор не даёт разрешений и не отвечает за эшелонирование. Он даёт информацию о движении, погоде, зонах. Полный доклад при первом вызове помогает ему тебя «видеть» в картине.',
   tips:['В Польше FIS часто просит squawk — выполняй.','Сектора FIS Gdańsk: восток 127.150, запад 125.275 (сверяй по AIP).']},
  {ctx:'FIS передаёт информацию о движении.',

/* ===================== ДРИЛЛЫ (случайные readback) ===================== */
const R=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function genDrill(n){
  const stations=[['Gdańsk Tower','118.105'],['Gdańsk Ground','131.330'],['Gdańsk Approach','127.280'],['Gdańsk Information','127.150'],['Gdańsk Information','125.275'],['Elbląg Radio','122.305'],['Gdańsk Delivery','131.325'],['Gdańsk Director','133.660']];
  const pts=['GOLF','MIKE','INDIA','NOVEMBER','SIERRA','X-RAY','ZULU'];
  const steps=[];
  for(let k=0;k<n;k++){
    const qnh=rnd(985,1035),sq=String(rnd(2,7))+String(rnd(0,7))+String(rnd(0,7))+String(rnd(0,7)),rwy=R(['11','29','10','28']),hdg=String(rnd(1,36)*10).padStart(3,'0'),alt=R([1000,1500,2000,2500,3000,3500]),[stn,frq]=R(stations),pt=R(pts),hp=R(['Alfa 4','Alfa 6','Bravo 1','Alfa 1']),twy=R(['Bravo and Alfa','Alfa','Charlie and Bravo']),lr=R(['left','right']),cd=R(['climb','descend']);
    const T=[
      {atc:`{CS}, QNH ${qnh}.`,pilot:`QNH ${qnh}, {CS}.`,keys:[['QNH '+qnh,String(qnh)],['Позывной','CS']]},
      {atc:`{CS}, squawk ${sq}.`,pilot:`Squawk ${sq}, {CS}.`,keys:[['Squawk '+sq,sq],['Позывной','CS']]},
      {atc:`{CS}, contact ${stn} ${frq}.`,pilot:`${stn} ${frq}, {CS}.`,keys:[['Станция',stn.split(' ')[1].toLowerCase()],['Частота '+frq,frq],['Позывной','CS']]},
      {atc:`{CS}, wind ${hdg} degrees ${rnd(3,15)} knots, runway ${rwy}, cleared to land.`,pilot:`Runway ${rwy}, cleared to land, {CS}.`,keys:[['ВПП '+rwy,rwy],['Cleared to land','cleared to land'],['Позывной','CS']]},
      {atc:`{CS}, runway ${rwy}, cleared for take-off.`,pilot:`Runway ${rwy}, cleared for take-off, {CS}.`,keys:[['ВПП '+rwy,rwy],['Cleared for take-off','take-off|takeoff'],['Позывной','CS']]},
      {atc:`{CS}, turn ${lr} heading ${hdg}, ${cd} to altitude ${alt} feet, QNH ${qnh}.`,pilot:`${lr[0].toUpperCase()+lr.slice(1)} heading ${hdg}, ${cd==='climb'?'climbing':'descending'} to altitude ${alt} feet, QNH ${qnh}, {CS}.`,keys:[['Направление '+lr,lr],['Курс '+hdg,hdg],['Высота '+alt,String(alt)],['QNH '+qnh,String(qnh)],['Позывной','CS']]},
      {atc:`{CS}, taxi to holding point ${hp} runway ${rwy} via ${twy}, QNH ${qnh}.`,pilot:`Taxi to holding point ${hp} runway ${rwy} via ${twy}, QNH ${qnh}, {CS}.`,keys:[['Holding point '+hp,hp.toLowerCase().replace('alfa','alfa|alpha').split('|').length>1?hp.toLowerCase()+'|'+hp.toLowerCase().replace('alfa','alpha'):hp.toLowerCase()],['ВПП '+rwy,rwy],['Маршрут via '+twy,twy.split(' ')[0].toLowerCase()],['QNH '+qnh,String(qnh)],['Позывной','CS']]},
      {atc:`{CS}, enter CTR via ${pt}, not above ${alt} feet, squawk ${sq}, QNH ${qnh}.`,pilot:`Enter CTR via ${pt}, not above ${alt} feet, squawk ${sq}, QNH ${qnh}, {CS}.`,keys:[['Точка '+pt,pt.toLowerCase().replace('x-ray','x-ray|xray')],['Not above '+alt,String(alt)],['Squawk '+sq,sq],['QNH '+qnh,String(qnh)],['Позывной','CS']]},
      {atc:`{CS}, ${cd} to altitude ${alt} feet, QNH ${qnh}, squawk ${sq}, contact ${stn} ${frq}.`,pilot:`${cd==='climb'?'Climbing':'Descending'} to altitude ${alt} feet, QNH ${qnh}, squawk ${sq}, ${stn} ${frq}, {CS}.`,keys:[['Высота '+alt,String(alt)],['QNH '+qnh,String(qnh)],['Squawk '+sq,sq],['Частота '+frq,frq],['Позывной','CS']]},
    ];
    const t=R(T);
    steps.push(Object.assign({ctx:'Дрилл: услышь один раз и повтори обязательные элементы. Текст скрыт — как в эфире.',who:'atc',note:'Порядок как у диспетчера, позывной в конце. Если не разобрал — лучше «say again …», чем угадывать.',tips:[],drill:true},t));
  }
  return {id:'drill',title:'Дриллы readback',sub:'Случайные QNH, squawk, частоты, курсы, высоты, руление — на скорость',intro:'',steps};
}
let DRILL=null,WEAK=null;
function findModule(id){if(id==='drill')return DRILL;if(id==='weak')return WEAK;return MODULES.find(x=>x.id===id)}
function buildWeak(){
  const steps=[];
  MODULES.forEach(m=>m.steps.forEach((s,i)=>{const r=(state.progress[m.id]||{})[i];if(r&&r.score<80)steps.push(Object.assign({},s,{src:{id:m.id,i},ctx:`[${m.title}] `+s.ctx}))}));
  WEAK={id:'weak',title:'Слабые места',sub:'',intro:'',steps};return steps.length;
}

const LS='vfr-radio-v1';

/* ===================== УТИЛИТЫ РЕЧИ ===================== */
function csPhonetic(cs){return cs.replace(/-/g,'').toUpperCase().split('').map(c=>/[A-Z]/.test(c)?PH[c]:DIG[+c]||c).join(' ')}
function fill(t){return (t||'').replace(/\{CS\}/g,state.cs)}
function numWords(n){ // altitude: 1500 -> one tousand five hundred
  n=+n; if(n>=1000){const th=Math.floor(n/1000),h=Math.floor((n%1000)/100);let s=DIG[th]+' thousand';if(h)s+=' '+DIG[h]+' hundred';return s}
  if(n>=100&&n%100===0)return DIG[n/100]+' hundred';
  return String(n).split('').map(d=>DIG[+d]).join(' ');
}
function spoken(t){
  let s=fill(t);
  s=s.replace(new RegExp(state.cs.replace(/[-]/g,'\\-'),'gi'),csPhonetic(state.cs));
  s=s.replace(/\b(\d{3})\.(\d{1,3})\b/g,(m,a,b)=>a.split('').map(d=>DIG[+d]).join(' ')+' decimal '+b.split('').map(d=>DIG[+d]).join(' '));
  s=s.replace(/\b(\d{3,4}) feet\b/g,(m,a)=>numWords(a)+' feet');
  s=s.replace(/\b(\d+) (miles|minutes|kilometres|knots|persons|hours)\b/g,(m,a,u)=>(+a<10?DIG[+a]:a.split('').map(d=>DIG[+d]).join(' '))+' '+u);
  s=s.replace(/\b(\d{1,2}) o'clock/g,(m,a)=>(+a<=12?['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'][+a]:a)+" o'clock");
  s=s.replace(/\b(\d+)\b/g,(m,a)=>a.split('').map(d=>DIG[+d]).join(' '));
  s=s.replace(/\bAlfa (\w)\b/g,'Alfa $1');
  s=s.replace(/Gdańsk/g,'Gdansk').replace(/Elbląg/g,'Elblong').replace(/CTR/g,'C T R').replace(/TMA/g,'T M A').replace(/MCTR/g,'M C T R').replace(/QNH/g,'Q N H').replace(/VFR/g,'V F R').replace(/ATIS/g,'A T I S').replace(/MAYDAY/g,'Mayday').replace(/PAN PAN/g,'pan pan');
  return s;
}
let voices=[];
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let curAudio=null;const noAudio={};
function speak(text,onend,file){
  if(curAudio){curAudio.pause();curAudio=null}
  if(file&&!noAudio[file]){ // готовый mp3 из папки audio/, если есть
    try{
      const a=new Audio('audio/'+file+'.mp3');a.playbackRate=Math.max(0.6,Math.min(1.3,state.rate/0.95));
      a.onended=()=>onend&&onend();a.onerror=()=>{noAudio[file]=1;speakTTS(text,onend)};
      curAudio=a;a.play().catch(()=>{noAudio[file]=1;speakTTS(text,onend)});return;
    }catch(e){}
  }
  speakTTS(text,onend);
}
function speakTTS(text,onend){
  if(!('speechSynthesis' in window)){toast('Озвучка недоступна в этом браузере');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(spoken(text));
  u.lang='en-GB';u.rate=state.rate;
  const v=voices.find(v=>v.name===state.voice)||voices.find(v=>/en-GB/i.test(v.lang))||voices[0];
  if(v)u.voice=v;
  u.onend=()=>onend&&onend();u.onerror=()=>onend&&onend();
  speechSynthesis.speak(u);
}

/* ===================== ПРОВЕРКА ОТВЕТА ===================== */
const W2D={zero:'0',oh:'0',one:'1',two:'2',three:'3',tree:'3',four:'4',fower:'4',five:'5',fife:'5',six:'6',seven:'7',eight:'8',nine:'9',niner:'9'};
function norm(t){
  let s=(t||'').toLowerCase().replace(/[,.;:!?]+(\s|$)/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/\bdecimal\b|\bpoint\b/g,'.');
  s=s.split(' ').map(w=>W2D[w]!==undefined?W2D[w]:w).join(' ');
  s=s.replace(/\b(\d) thousand(?: (\d) hundred)?\b/g,(m,a,b)=>String(+a*1000+(b?+b*100:0)));
  s=s.replace(/\b(\d) hundred\b/g,(m,a)=>String(+a*100));
  // collapse single digits / dots separated by spaces: "2 9" -> "29", "1 1 8 . 1 0 5" -> "118.105"
  s=s.replace(/\b(?:\d|\.)(?: (?:\d|\.))+\b/g,m=>m.replace(/ /g,''));
  s=s.replace(/\s*\.\s*/g,'.').replace(/\bsp ?- ?/g,'sp-');
  return ' '+s+' ';
}
function csRegex(){
  const raw=state.cs.toLowerCase(); const nodash=raw.replace(/-/g,'');
  const ph=csPhonetic(state.cs).toLowerCase(); const last3=ph.split(' ').slice(-3).join(' ');
  const alt=[raw,nodash,raw.replace('-',' '),ph,last3,ph.replace(/x-ray/g,'xray'),ph.replace(/alfa/g,'alpha'),ph.replace(/juliett/g,'juliet')];
  return new RegExp(alt.map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'i');
}
function keyRegex(k){
  if(k==='CS')return csRegex();
  return new RegExp(k.replace(/\./g,'\\.').replace(/\bsay again\b/,'say again').replace(/alpha/g,'alpha'),'i');
}
function check(answer,keys){
  const n=norm(answer);
  return keys.map(([label,re])=>({label,hit:keyRegex(re).test(n)}));
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function hlModel(text,keys){ // подсветка ключевых элементов в эталоне

function saveResult(id,i,score){const st=findModule(id).steps[i];if(st.drill){state.drills=(state.drills||0)+1;save();return}if(st.src){id=st.src.id;i=st.src.i}state.progress[id]=state.progress[id]||{};const prev=state.progress[id][i];state.progress[id][i]={score:prev?Math.max(prev.score,score):score};save()}

function startRec(ta){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Распознавание речи недоступно здесь — используй голосовой набор клавиатуры');ta.focus();return}
  try{
    rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.maxAlternatives=1;
    const btn=$('#mic');btn.classList.add('pulse');btn.textContent='🎤 Слушаю…';
    rec.onresult=e=>{ta.value=e.results[0][0].transcript};
    rec.onerror=e=>{toast('Микрофон недоступен в этом окне (' +e.error+ '). Введи текстом или через голосовую клавиатуру.');ta.focus()};
    rec.onend=()=>{btn.classList.remove('pulse');btn.textContent='🎤 Сказать'};
    rec.start();
  }catch(e){toast('Микрофон недоступен — введи текстом');ta.focus()}
}

function renderRef(){
  view={name:'ref'};title.textContent='Шпаргалка';back.style.visibility='visible';
  main.innerHTML=`<div class="card ref">
  <h4>Алфавит ICAO</h4><div class="grid">${Object.entries(PH).map(([k,v])=>`<div><b>${k}</b> ${v}</div>`).join('')}</div>
  <h4>Цифры</h4><div class="grid">${DIG.map((d,i)=>`<div><b>${i}</b> ${i===3?'tree':i===5?'fife':i===4?'fower':d}</div>`).join('')}<div><b>.</b> decimal</div><div><b>1000</b> tousand</div><div><b>100</b> hundred</div></div>
  <div class="small muted" style="margin-top:6px">По цифрам: частоты, QNH, squawk, ВПП, курс, ветер, время. Целиком: высоты (two tousand five hundred), видимость, облачность (whole numbers).</div>
  <h4>Стандартные слова (SERA.14055 / Doc 9432)</h4>
  <ul><li><b>AFFIRM</b> — да · <b>NEGATIVE</b> — нет · <b>ROGER</b> — принял (не согласие!) · <b>WILCO</b> — понял, выполню</li>
  <li><b>SAY AGAIN</b> — повтори · <b>STANDBY</b> — жди · <b>UNABLE</b> — не могу · <b>CORRECTION</b> — исправляю себя</li>
  <li><b>CONFIRM</b> — подтверди · <b>READ BACK</b> — повтори мне · <b>MONITOR</b> — слушай частоту · <b>CONTACT</b> — вызови</li>
  <li><b>APPROVED</b> — для руления/запуска · <b>CLEARED</b> — только взлёт/посадка/маршрут · <b>GO AHEAD / PASS YOUR MESSAGE</b> — говори</li></ul>
  <h4>Обязательный readback (SERA.14035)</h4>
  <ul><li>маршрутные разрешения ATC (в т.ч. вход/выход CTR, TMA)</li><li>вход на ВПП, посадка, взлёт, hold short, пересечение, руление и backtrack по любой ВПП</li><li>ВПП в работе, QNH, код SSR, новая частота, уровень, курс, скорость, transition level</li></ul>
  <div class="small muted">Остальное — подтверждение позывным или «wilco». Позывной — в конце readback.</div>
  <h4>Структура первого вызова</h4>
  <ul><li>Станция → позывной → тип ВС → откуда/куда → позиция → высота → QNH/ATIS → запрос</li></ul>
  <h4>Бедствие и срочность</h4>
  <ul><li><b>MAYDAY ×3</b> — бедствие · <b>PAN PAN ×3</b> — срочность</li><li>Станция → позывной → характер → намерение → позиция, высота, курс → POB</li><li>Коды: 7700 бедствие · 7600 отказ связи · 7500 захват · 7000 VFR</li><li>121.500 — аварийная частота</li></ul>
  <h4>Район Гданьска (сверять по AIP)</h4>
  <ul><li>EPGD: ATIS 129.630 · Delivery 131.325 · Ground 131.330 · Tower 118.105 · Approach 127.280 · Director 133.660 · ВПП 11/29</li>
  <li>CTR Gdańsk класс D, GND–2000 ft AMSL; вход VFR не выше 1500 ft; точки GOLF, INDIA, MIKE, NOVEMBER, SIERRA, X-RAY, ZULU; ожидание над GOLF/NOVEMBER/SIERRA</li>
  <li>FIS Gdańsk Information: восток 127.150 · запад 125.275</li>
  <li>EPEL Elbląg Radio 122.305 · ВПП 10/28 грунт 700 м</li></ul>
  </div>`;
}
function renderSettings(){
  view={name:'set'};title.textContent='Настройки';back.style.visibility='visible';
  main.innerHTML=`<div class="card set">
   <label>Твой позывной (регистрация)</label><input type="text" id="cs" value="${esc(state.cs)}" maxlength="8" autocapitalize="characters">
   <div class="small muted" style="margin-top:4px">В эфире прозвучит: <b id="csph">${csPhonetic(state.cs)}</b></div>
   <label>Скорость речи диспетчера: <span id="ratev">${state.rate}</span></label><input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="${state.rate}">
   <label>Голос</label><select id="voice"><option value="">Авто (en-GB)</option>${voices.map(v=>`<option value="${esc(v.name)}" ${v.name===state.voice?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select>
   <div class="row" style="margin-top:14px"><button class="btn primary" id="test">▶︎ Тест голоса</button><button class="btn" id="reset">Сбросить прогресс</button></div>
   <div class="warn" style="margin-top:14px">Если список голосов пуст — на iPhone/Android голоса подгружаются после первого нажатия «Слушать». Английский голос улучшает реализм, но настоящий эфир всегда хуже: тренируй и на скорости 1.2.</div>
  </div>`;
  $('#cs').oninput=e=>{state.cs=e.target.value.toUpperCase().trim()||'SP-KAB';$('#csph').textContent=csPhonetic(state.cs);save()};
  $('#rate').oninput=e=>{state.rate=+e.target.value;$('#ratev').textContent=state.rate;save()};
  $('#voice').onchange=e=>{state.voice=e.target.value;save()};
  $('#test').onclick=()=>speak('{CS}, Gdańsk Tower, runway 29, cleared for take-off, wind 280 degrees 8 knots.');
  $('#reset').onclick=()=>{state.progress={};save();toast('Прогресс сброшен')};
}

back.onclick=()=>{if(view.name==='step'&&view.id!=='drill'&&view.id!=='weak')renderModule(view.id);else renderHome()};
$('#refbtn').onclick=renderRef;$('#setbtn').onclick=renderSettings;
renderHome();
</script>
</body>
</html>
